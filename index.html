<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cảnh báo bảo mật - Thanh toán ngay</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="gift.png" />
  </head>
  <body>
    <div id="lockscreen">
      <h1 class="title">MÁY TÍNH CỦA BẠN ĐÃ BỊ KHÓA!</h1>
      <div class="warning">Tất cả dữ liệu đã bị mã hóa bởi Hacker Dave</div>
      <div class="countdown" id="timer">23:59:59</div>
      <div class="warning">
        Gửi cho tôi 5.0000 VND đến QR sau để lấy khóa giải mã:
      </div>
      <div class="btc">
        <img style="width: 222px; height: 222px" src="qr.jpg" alt="" />
      </div>
      <div class="warning" style="color: #f00; font-size: 2rem">
        ĐỪNG TẮT MÁY - DỮ LIỆU SẼ MẤT VĨNH VIỄN!
      </div>
    </div>

    <video id="webcam" autoplay playsinline></video>

    <audio id="alarm" loop>
      <source
        src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"
        type="audio/mpeg"
      />
    </audio>

    <audio id="finalscream">
      <source
        src="https://www.myinstants.com/media/sounds/female_terror_scream.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script src="main.js"></script>
  </body>
</html>
